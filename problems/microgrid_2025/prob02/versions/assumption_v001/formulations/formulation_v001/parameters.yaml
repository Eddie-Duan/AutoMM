objective:
  sense: minimize
  expression: "sum_{d in D_full} sum_{t=1..144} [ p_t * b_{d,t} + 5 * p_t * q_em_{d,t} ]"
  unit: 元
  components:
    C_plan: "sum p * b"
    C_em: "sum 5 * p * q_em"
    C_total: "C_plan + C_em（本问 q_em = 0 故 C_total = C_plan）"
  forbidden_forms:
    - "sum p * b * delta_t（量纲 元*h，偏小 6 倍；D9 已裁定修正）"
    - "sum 5 * p * q_em * delta_t（同上）"
  assumption_refs: [AS05]

identities:
  I1: "sum_tau q_dis = eta_ch*eta_dis*sum_tau c - eta_dis*(E_T - E_0)"
  I2: "sum_tau b = N + sum_tau s + (1 - eta_ch*eta_dis)*sum_tau c + eta_dis*(E_T - E_0) - sum_tau q_em"
  I2_delivery: "sum_{D_req} b = N_req + sum s + 0.19*sum c + eta_dis*(E_{12/31,144} - E_{2/1,0}) - sum q_em"
  continuity: "|E_{d,0} - E_{d-1,144}| <= 1e-6"
  q_em_zero_proof: "完全信息 + b 无上界 + alpha_em > 1 且 p > 0 推出 q_em = 0（定理 T1，模型内数学推论，非文献结论）"

