# prob02 ablation 隔离计算 task 级配置
# 生成者：ablation-analyst（动作 act-d2b711aa1991482f）；阶段：ablation（config/workflow.yaml 的 mandatory_stages）
# 依据：ablations/plan.md（预注册：M1–M7 + M6′、判据 C1–C7、公平性纪律）、prob02 团队裁定 B0–B5/D1–D8
#       与勘误 R1–R5、agents/ablation-analyst.md、skills/ablation-study/SKILL.md
# 用途：由 scripts/compute_dispatcher.py submit 时作为 --config-path 传入；
#       effective_config 会把它合并到全局配置之上（仅影响本 task）。
compute:
  default_backend: local
  max_local_concurrent_tasks: 1
  memory_per_worker_gb: 2
  task_timeout_seconds: 7200
  timeout_retry_attempts: 2
  retry:
    infrastructure_transient: 3
    code_runtime: 2
    model_revision: 2
  resource_notes:
    device: cpu
    gpu_required: false
    concurrent_gpu_tasks: 0
    note: >-
      prob02 ablation 共 13 个全年 52,560 时段 LP（M1、M7、M5、M6×4、M6′×6）、
      3 × 365 个日规模 LP（M2a/M2b/M4）、1 个全规模互补 MILP（52,560 个二元，限时 300 s，
      在独立子进程中运行以隔离内存）与 4 个指定日期的日规模 MILP（各 144 个二元）。
      全部为 CPU HiGHS；本机可用内存偏低（约 1.3–2.1 GB），单 worker 串行，不安排多 worker 并发。
      全规模 MILP 的子进程若因内存/时限退出，父进程按 D5 降级并以代表日 MILP 作数值 oracle。
    worker_launch_mode: "supervised（继承 config/compute.yaml；detached 在本环境会被沙箱回收）"
solver:
  name: highs
  interface: "scipy.optimize.linprog(method='highs'/'highs-ds') 与 scipy.optimize.milp"
  device: cpu
  time_limit_seconds: 300
  deterministic: true
  seed: 20260910
