# prob01 ablation 隔离计算 task 规格
# 生成者：ablation-analyst（动作 act-8fc1f3e5e410428c）；阶段：ablation
# 依据：assumptions.md 末尾「团队裁定（ablation 多模型对比设计与预注册判据）」、agents/ablation-analyst.md、
#       config/workflow.yaml（ablation 属 mandatory_stages，不得 skipped）、ablations/plan.md（预注册）
# 说明：本文件是**规格**；task 由 scripts/automm/tasks.py 的 make_task_spec/submit_task 确定性创建
#       （status=queued），再由 Runner 以 worker_launch_mode=supervised 原地运行。
#       Agent 不自行代跑，也不在短命 shell 内调用 start_queued。
spec_version: 1
problem_id: microgrid_2025
question_id: prob01
stage: ablation
assumption_version: assumption_v003
formulation_version: formulation_v001
backend: local
working_directory: "."
code_path: problems/microgrid_2025/prob01/versions/assumption_v003/ablations/code
config_path: problems/microgrid_2025/prob01/versions/assumption_v003/ablations/code/task_config.yaml
input_path: data
output_directory: problems/microgrid_2025/prob01/versions/assumption_v003/ablations/results/prob01_v003_ablation_run001
timeout_seconds: 900
seed: 20260910
gpu_required: false
device: cpu
gpu_serial_constraint: "本 task 不使用 GPU，故不占用单卡 GPU 串行额度"
worker_launch_mode: supervised
command:
  - ".venv/Scripts/python.exe"
  - "problems/microgrid_2025/prob01/versions/assumption_v003/ablations/code/ablation_prob01.py"
  - "--input"
  - "data/附件1.xlsx"
  - "--output"
  - "problems/microgrid_2025/prob01/versions/assumption_v003/ablations/results/prob01_v003_ablation_run001"
  - "--seed"
  - "20260910"
  - "--time-limit"
  - "60"
  - "--dp-steps"
  - "400,200,100,50"
submit_hint:
  tool: scripts/automm/tasks.py (make_task_spec + submit_task)
  notes:
    - "必须由 Runner 以 supervised（in-process）启动；detached 会被沙箱进程树回收。"
    - "--output 必须与 output_directory 完全一致（make_task_spec 强校验）。"
    - "output_directory 必须位于 assumption_v003 目录内（make_task_spec 强校验）。"
    - "input_path=data 使附件 1/2/3/4/5 全部进入 input_hash；只读，不修改。"
inputs_readonly:
  - data/附件1.xlsx
  - data/（作为 input_path 整体参与 input_hash）
  - problems/microgrid_2025/prob01/versions/assumption_v003/code/prob01_model.py（独立实现交叉检查，只读）
  - problems/microgrid_2025/prob01/versions/assumption_v003/results/prob01_v003_f001_run002/solution.json（C1 基线闸门，只读）
expected_outputs:
  - baseline_check.json
  - solver_status.json
  - comparison.json
  - dp_granularity.json
  - raw_cases.jsonl
  - summary.json
  - run_manifest.json
  - A_baseline_LP/case.json
  - B_milp/case.json
  - C_dp_h400/case.json
  - C_dp_h200/case.json
  - C_dp_h100/case.json
  - C_dp_h050/case.json
  - D_no_periodic/case.json
  - E_no_spill/case.json
  - F_place_both/case.json
  - F_place_charge_only/case.json
  - F_place_discharge_only/case.json
  - F_place_round_trip/case.json
  - figures/ablation_model_cost.png
  - figures/ablation_dp_granularity.png
  - figures/ablation_waterfall.png
  - figures/ablation_complexity_tradeoff.png
expected_runtime:
  wall_clock_seconds_max: 900
  memory_mb_max: 500
  device: cpu
expected_failure_conditions:
  - exit_code: 4
    meaning: "C1 基线复现闸门失败：本实验代码与 accepted run002 不一致，整批作废"
    route: "needs_revision -> implementation/ablation 复核模型口径"
  - exit_code: 3
    meaning: "输入结构或 DP 粒度参数非法"
    route: "needs_revision -> ablation 修复代码"
  - exit_code: 1
    meaning: "未捕获异常（Python 运行时错误）"
    route: "code_runtime -> ablation-analyst 修复代码后新 attempt + 新 output_directory"
acceptance_hint:
  - "baseline_check.json: passed=true、6 项相对差均 ≤1e-6、accepted_impl_cross_check.passed=true"
  - "solver_status.json: feasible_incumbent=true、baseline_check_passed=true"
  - "raw_cases.jsonl: 每 case 一行、无 NaN/Inf；失败 case 保留"
  - "summary.json: 判据 C1–C7 判定、结论 K1–K3、技术债齐备"
  - "run_manifest.json: task_id、code_sha256、输入 md5、seed、计数、耗时齐备"
