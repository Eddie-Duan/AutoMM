# prob01 robustness task 级配置
# 生成者：robustness-analyst（动作 act-edd4595657bb4bea）
# 用途：提交隔离计算 task 时作为 --config-path；effective_config 将其合并到全局配置之上（仅影响本 task）。
compute:
  default_backend: local
  max_local_concurrent_tasks: 1
  memory_per_worker_gb: 2
  task_timeout_seconds: 900
  timeout_retry_attempts: 2
  retry:
    infrastructure_transient: 2
    code_runtime: 1
    model_revision: 2
  resource_notes:
    device: cpu
    gpu_required: false
    concurrent_gpu_tasks: 0
    note: "prob01 robustness 为 ~900 个 144 时段 LP，CPU HiGHS，单次 <1 s、峰值内存 <200 MB；不占用单卡 GPU"
    worker_launch_mode: "supervised（继承 config/compute.yaml；detached 在本环境会被沙箱回收）"
solver:
  name: highs
  interface: "scipy.optimize.linprog(method in {highs, highs-ds, highs-ipm})"
  device: cpu
  time_limit_seconds: 60
  deterministic: true
  seed: 20260910
