- id: AS01
  title: 时间戳与时段的位置对齐（左端点，继承 prob01 AS01）
  statement: 附件 1/2/3 的数据点与 result3.xlsx 的 144 个时段按位置一一对应；附件时间戳是所属 10 分钟区间的左端点（位置
    i 的时间戳 tau_i = 10i 分钟，tau_1 = 0:10，…，tau_144 = 0:00+1 = 24:00），代表区间 [tau_i, tau_i+10min)。prob03
    的计划窗为 0:10 → 24:10（模板固有相位）；表 1 的「10:00-10:10」取位置 i = 60，4 个指定日期按模板行位置聚合成 6 个 4
    小时块。
  type: 离散化约定（数据生成）
  key: false
  criticality: high
  evidence_type: inherited
  reference_ids: []
  basis: 题面附录 2「表中的 0:00+1 表示第二天凌晨 0:00，即当天 24:00」；result3.xlsx 模板实测列标签 0:10-0:20
    … 0:00-0:10+1； prob01 accepted AS01（team_decision）已用独立探针逐行核对 0 错位。证据义务已在 prob01
    池清偿，prob03 池不覆盖该主题， 故本问不绑定文献、不抬高证据类型。
  applicability: prob03 全部输入与交付；对 prob04-3 同类对齐生效。
  bias_if_invalid: 若改按右端点口径，整表错位一格且模板末列 0:00-0:10+1 需外推不存在的 24:10 点。
  validation: sanity L1 核对四个工作表行列数与列标签；L3 抽查表 1 六时段与表 2 六块的行位置映射。
  relations: 决定 AS05 的整点—块位置映射与 AS16 的表 2 聚合相位。
  status: inherited
