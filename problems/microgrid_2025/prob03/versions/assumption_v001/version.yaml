    月为预热期、不计入交付； 交付期首日 2025-02-01 的 0:00 储电量由轨迹给出（prob02 隔离 task 实测 7950.00 kWh），不等于
    6000。prob03 的计划层与 实际结算层均从上一日末的真实状态起算，不逐日复位。
