- id: AS05
  title: 附件 3 预报语义、10 分钟降尺度与年末边界（A6）
  statement: 附件 3 的「预报 k 小时」解释为发布时刻 m 之后第 k 个整点的功率点值（(m+k):00 的瞬时功率）。10 分钟降尺度以整点值为锚做
    线性插值：时段 i 的左端点 tau_i 落在小时区间 [h, h+1) 时取 P(h) 与 P(h+1) 的线性插值；发布后的第一小时无 P(m)，以 P(m+1)
    前向保持。插值不强制块内能量守恒（能量由插值曲线积分给出）。年末边界：发布时刻 m 只支配时段 i ≥ 6m+1，预报项 (m,k) 按块位置映射到 b =
    m + k；b > 24 的跨年项（6:00 的 k = 19…24、12:00 的 k = 13…24、18:00 的 k = 7…24， 对应 2026-01-01）不被消费，不截断、不外推、不使用
    2026 数据。
  type: 离散化约定（预报语义与降尺度）
  key: true
  criticality: high
  evidence_type: literature_fact
  reference_ids:
  - ref-almpantis-2024-minute-downscaling
  - ref-grantham-2017-5min-from-hourly
  - ref-martins-2021-1min-irradiance
  - ref-stenzel-2016-temporal-resolution
  - ref-barbieri-2017-very-short-term-pv
  - ref-sweeney-2020-forecasting-future
  basis: 题面「可获得未来 24 小时整点的光伏发电功率预报」。只读探针（本动作）实测：预报值对实际整点值的 RMSE = 269.50 kW、偏置 +12.58
    kW，而锚定到相邻整点（±1 h）时 RMSE 升至 1041.88 / 1038.88 kW，支持整点点值语义；以整点值为锚的线性插值 per-period
    RMSE = 303.92 kW，显著优于分段常数 580.62 kW（块内前向保持）。文献只支撑「小时分辨率不足以表征短时波动、 必须显式降尺度、不能默认常数」的机制方向（ref-almpantis-2024-minute-downscaling、ref-grantham-2017-5min-from-hourly、
    ref-martins-2021-1min-irradiance）与「分辨率影响指标的方向性」（ref-stenzel-2016-temporal-resolution，仅方向性证据），
    不裁定取哪一条规则。
  applicability: prob03 计划层与各调整层的预报输入；prob04-3 沿用同一规则。
  bias_if_invalid: 若改分段常数，逐 10 分钟 RMSE 由 303.92 升至 580.62 kW，且块内能量被人为抬成「点值 × 1 h」；若误按右端点或
    小时平均语义，锚定误差上升约 3.8 倍。
  validation: formulation 须显式写出插值公式、支配时刻表与年末项清单；sanity L1 核对每时段只取最后一个已发布预报且无回溯； L2
    复核预报—实际能量差与 q_em/s 的闭合。
  relations: 决定 AS06/AS07 的信息集边界；与 AS13 的实际结算余量联动。
  status: accepted
- id: AS06
  title: 逐时刻信息集与决策节奏（A19）
  statement: 每天 4 个决策时刻 m ∈ {0:00, 6:00, 12:00, 18:00}；时刻 m 的决策只使用 m 时刻已发布的附件 3 预报（按
    AS05 降尺度）、 已知的附件 2 负载与附件 1 电价，以及已实现的过去状态；不得使用未来实际值，不得回溯修改已执行时段。计划（0:00）按 0:00
    预报做 全天可行计划；6:00/12:00/18:00 按各自时刻预报重优化其后的时段；实际结算用附件 2 的实际光伏，缺口由紧急购电 q_em 补足（5
    倍价）、盈余由弃光 s 消纳。q_em 与调整量必须保留为变量。**不得移植 prob02 的 A17（完全信息 ⇒ q_em ≡ 0）。**
  type: 信息结构（不确定性处理）
  key: true
  criticality: high
  evidence_type: literature_fact
  reference_ids:
  - ref-bhattacharya-2018-multistage-storage
  - ref-shinde-2022-multistage-vpp
  - ref-li-2016-two-stage-rhc
  - ref-matamala-2021-two-stage-stackelberg
  - ref-haberg-2019-stochastic-uc
  - ref-toubeau-2019-probabilistic-forecast
  - ref-sweeney-2020-forecasting-future
  basis: 题面明文要求「可根据 0:00 的预报制定当天的计划购电策略，也可根据其他时刻的预报调整购电策略」，且附件 2 是实际功率、附件 3 是预报，故决策层与实际结算层必然分离。文献支撑「决策分阶段、每阶段依据新到信息调整」「依据更新预报修改原计划」「预报质量影响
    决策质量」的标准范式（框架级），不替团队在信息结构之间选择。本动作只读探针诊断：按各时刻支配预报与实际光伏的全年能量差为 deficit 506,043.06
    kWh / surplus 459,488.67 kWh（线性插值口径），说明预报误差实存、q_em 有非零可能。
  applicability: prob03 全部；prob04-3 沿用「预报驱动 + 实际结算」，价格可观测性另由 A8 裁定。
  bias_if_invalid: 若取完全信息（0:00 即知全天实际值），调整机制退化、q_em ≡ 0、附件 3 不被使用，与题面明确要求相悖；若取混合/随机口径，
    本问无负载预报数据与误差分布接口，属越界。
  validation: sanity L1 核对每时段支配预报的来源（无未来信息）；L2 复核实际结算平衡残差与 q_em ≥ 0；ablation 按 A9
    对照「仅 0:00」 与「追加更多时刻」。
  relations: 与 AS07（层结构）、AS09（结算）、AS10（目标分解）联立；是 A9 分析的前提。
  status: accepted
- id: AS07
  title: 计划层 / 调整层 / 实际结算层的三层结构与不回溯
  statement: 模型分三层。计划层（0:00，按 0:00 预报对 D_full 全天可行：b + PVfc0·Dt + q_dis^pl = L·Dt
    + c^pl + spl，含计划储电量 轨迹与跨日衔接）；调整层（6:00/12:00/18:00，按各自时刻预报、以实际已实现状态为初值，顺序重优化其支配的剩余时段，得到最终
    购电量 q 与最终充放电/储电量轨迹）；实际结算层（用附件 2 实际光伏闭合实际平衡 q + q_em + PVact·Dt + q_dis = L·Dt
    + c + s）。 q_t 取支配该时段的最后一个决策时刻的取值（替代量、不回溯），t ≤ 36 时 q_t = b_t。**单一确定性路径下，「各时刻只用该时刻
    已发布信息」由顺序滚动求解实现，不得用一次性联合 LP 让计划层/调整层看到未来实际值。**
  type: 机理（决策时序与层结构）
  key: true
  criticality: high
  evidence_type: literature_fact
  reference_ids:
  - ref-li-2016-two-stage-rhc
  - ref-bhattacharya-2018-multistage-storage
  - ref-fusco-2023-multistage-uc
  - ref-elkazaz-2020-convex-mpc-rhc
  basis: 文献支撑两阶段随机规划 + 滚动时域（ref-li-2016-two-stage-rhc）、多阶段逐阶段依新信息调整（ref-bhattacharya-2018-multistage-storage）、
    含调整/回素的多阶段 MILP（ref-fusco-2023-multistage-uc）与微网 EMS 的滚动实现（ref-elkazaz-2020-convex-mpc-rhc）；
    题面 H10/H11 规定四个决策时刻且各时刻只用已发布信息。计划层与调整层的具体变量分层、目标与初始状态传递由 formulation 落地。
  applicability: prob03 全部求解与可追溯性设计；prob04-3 沿用。
  bias_if_invalid: 若用一次性联合 LP，计划层会「看到」实际值，等价于完全信息，C_adj 被系统性压低（趋近 0），本问的调整机制与 A9 的答案失真。
  validation: sanity L1 复核决策层时序（计划层不含实际值、调整层不含发布时刻之后的实际值）；L3 复核 q 与 b 的支配关系； implementation
    须保存各层求解日志与输入指纹。
  relations: AS06 的编码方式；与 AS09 的结算基准、AS10 的目标分解、AS15 的模型族联动。
  status: accepted
- id: AS08
  title: 供电可靠性与紧急购电的作用位置（A5）
  statement: 供电可靠性用等式电量平衡并显式含 q_em：实际结算层满足 q + q_em + PVact·Dt + q_dis = L·Dt + c
    + s，且 0 ≤ s ≤ PVact·Dt， 0 ≤ q_em，故供给 q + q_em + q_dis + (PVact·Dt − s) = L·Dt
    + c ≥ L·Dt 自动成立，题面「微网提供的电能不可低于小区负载」 得到保证，充电不与负载竞争。q_em 仅用于补足负载缺口、不得用于储能充电（该限制在本题最优解处不改变结果，但变量与触发保留）；
    单价为 alpha_em·p = 5p。不采用「净供给 ≥ 负载」弱口径，也不把 q_em 降级为事后派生量。
  type: 机理（功率平衡/可靠性）
  key: true
  criticality: high
  evidence_type: literature_fact
  reference_ids:
  - ref-shang-2017-emergency-pricing
  - ref-li-2024-energy-purchase-strategy
  - ref-elkazaz-2020-convex-mpc-rhc
  basis: 题面 H1 与问题 3 的总费用构成（含紧急购电费用）；prob01 accepted AS04 / prob02 AS06 的等式平衡口径（团队裁定
    D3/D4-A）； A5 在 prob03 仍是「推荐口径」而非团队已裁定项，故本版按推荐登记并保留 D7 决策点。文献只支撑「把不平衡量显式建模并配独立
    价格、滚动 EMS 与可靠性约束兼容」的形式，不裁定 q_em 是否可用于充电。
  applicability: prob03 实际结算层；prob04-2/4-3 沿用。
  bias_if_invalid: 弱口径会把充电量算作供给，放松可行性并可能制造账面套利；允许 q_em 充电会在有购电上限时扭曲结论。
  validation: sanity L1/L2 逐时段平衡残差（含 q_em 与 s）≤ 1e-6、统计 q_em 与 c 同为正的时段数；L4 检查供给 ≥
    负载。
  relations: 与 AS09（偏差结算）、AS13（s 的界）共同定义可行域。
  status: accepted
- id: AS09
  title: 计划 / 调整的双向分段结算（A7）
  statement: 计划与调整采用双向分段结算：C_adj = Σ_{d,t} [ beta_def·p_t·(b_{d,t} − q_{d,t})^+ +
    beta_over·p_t·(q_{d,t} − b_{d,t})^+ ]， beta_def = 0.5、beta_over = 1.5；两段均为成本项（beta_def
    段为违约金，不是退款）。比较基准为当天 0:00 计划 b： 以最终量 q 对计划做单次结算，不逐次链式重复计费。该分段函数可用非负辅助变量线性化（目标为
    min 且两段系数为正，辅助变量在 最优解处取紧）。
  type: 决策偏好（结算口径）
  key: true
  criticality: high
  evidence_type: literature_fact
  reference_ids:
  - ref-zhang-2020-eds-retailers
  - ref-chauhan-2024-dsm-over-under
  - ref-matsumoto-2022-imbalance-design
  - ref-munhoz-2021-two-settlement
  - ref-asgarpoor-1995-deviation-penalty
  - ref-danti-2019-intraday-rescheduling
  basis: 题面「计划购电量高于调整购电量的部分，违约电价是交易时刻电价的 50%；调整购电量高于计划购电量的部分，超出部分的电价是交易时刻 电价的 1.5
    倍」，beta_def/beta_over 为题面硬参数。文献支撑「计划—实际偏差按价格因子结算、区分欠/超两方向、偏差可写成显式 惩罚项」的制度与建模形式（框架级），不裁定
    0.5/1.5 的取值与方向。
  applicability: prob03 全部日期；prob04-3 在波动电价下沿用（p 换附件 4）。
  bias_if_invalid: 若把 beta_def 段当退款（C = C_plan − 0.5·p·(b−q)^+ + 1.5·p·(q−b)^+），在计划量可自由选择时会诱导「高报计划」的
    非物理激励；若用链式结算，同一时段多次调整会重复计费并与「调整购电量」单值列结构不相容。
  validation: sanity L3 复核 C_adj 的逐时段分解与辅助变量紧性（互补残差）；L4 复核费用方向与量级（单日 10^4 元、交付期 10^7
    元）； ablation 以结算口径对照（本版推荐 vs 备选 B 的实际交付计价）作结构比较。
  relations: 与 AS10（目标分解）、AS11（调整量语义）联合决定 C_total。
  status: accepted
