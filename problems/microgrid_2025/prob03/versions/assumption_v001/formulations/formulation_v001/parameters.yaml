objective:
  sense: minimize
  main_caliber:
    name: "T1-PLAN"
    plan_layer: "min sum_i p_i * b_{d,i}（团队 T1 主口径；仅 0:00 预报 + E_{d-1,144} + L + p）"
    adjustment_layer: "min sum_{i in R_m} [ beta_def*p_i*u^+_{d,i} + beta_over*p_i*u^-_{d,i} ]（该层剩余时段的偏差结算）"
    total: "C_total = C_plan + C_em + C_adj"
  PLAN_EXP_contrast:
    name: "PLAN-EXP"
    expression: "min sum_i p_i*b_i + E[ sum_i (beta_def*p_i*(b_i-q_i)^+ + beta_over*p_i*(q_i-b_i)^+) + sum_i alpha_em*p_i*q^em_i ]"
    information_set: "与主口径相同（仅 0:00 预报 + E_{d-1,144} + L + p）"
    status: "在无预报误差分布时退化为 T1-PLAN（§0.4 F5）；可实施化待团队裁定（决策点 D4）"
  components:
    C_plan: "sum p * b"
    C_adj: "sum [ 0.5*p*(b-q)^+ + 1.5*p*(q-b)^+ ]（两段均为成本项）"
    C_em: "sum 5 * p * q_em（结算层，实际光伏驱动）"
    C_total: "C_plan + C_em + C_adj"
  forbidden_forms:
    - "sum p * b * delta_t（量纲 元*h，偏小 6 倍；prob01 v001 旧口径，团队 D9 已裁定修正）"
    - "sum 5 * p * q_em * delta_t（同上）"
    - "sum beta * p * (b-q) * delta_t（同上）"
  assumption_refs: [AS09, AS10]

identities:
  I1d: "sum_i q_dis_{d,i} = eta_ch*eta_dis*sum_i c_{d,i} - eta_dis*(E_{d,144} - E_{d,0})"
  I2d: "sum_i q_{d,i} = N_d + sum_i s'_{d,i} + 0.19*sum_i c_{d,i} + eta_dis*(E_{d,144} - E_{d,0}) - sum_i q^em_{d,i}"
  I2req: "sum_{D_req} q = N_req + sum s' + 0.19*sum c + eta_dis*(E_{12/31,144} - E_{2/1,0}) - sum q^em"
  I3d_cost: "C_total,d = C_plan,d + C_adj,d + C_em,d；C_adj,d = 0.5*sum p*(b-q)^+ + 1.5*sum p*(q-b)^+"
  I4d_continuity: "|E_{d,0} - E_{d-1,144}| <= 1e-6；E_{1/1,0} = 6000"
  I5d_transition: "|E_{d,i} - E_{d,i-1} - 0.9*c_{d,i} + q_dis_{d,i}/0.9| <= 1e-6"
  I6d_settlement: "|q + q^em + pv_act*delta_t + q_dis - L*delta_t - c - s'| <= 1e-6"
  layer_balance: "各层用该层预报闭合：计划层 Pi_0；AD_m 用 Pi_m；残差 <= 1e-8"
  q_em_decision_lemma: "引理 L1：决策层 q_em ≡ 0（模型内数学推论，非文献结论；表 3 非零由预报误差在结算层产生）"

model_set:
  role: "团队裁定 B2：formulation 负责定义、ablation 负责实跑；主结果只以 M1 为准（B0）"
  M1:
    definition: "三层顺序向前递推 LP（计划 0:00 -> 调整 6/12/18 -> 实际结算），D_full 365 天，跨日状态连续，终端自由，计划层目标 min sum p*b"
    delivery_role: primary
    structure_note: "层次目标不可合并为单次联合 LP（§0.4 F1）；全年 1,460 次小 LP"
  M2a:
    definition: "逐日解耦 + 跨日状态递推（E_{d,0} 由前一日实测末端传入）"
    status_note: "与 M1 算法同构（F6）；C2 是结构性恒等式，不是分解等价的独立证据（决策点 D2）"
  M2b:
    definition: "日初复位 E_{d,0} = 6000，其余同 M1"
    status_note: "差额记为跨日携带价值的结构性发现，不得判为实现错误"
  M3:
    definition: "完全信息上界：0:00 即知全天附件 2 实际值 -> 单阶段 LP，q ≡ b，q_em ≡ 0，调整无信息增益"
    analytic_note: "引理 L6：M3 与 prob02 accepted formulation_v001 的 (P2) 逐项相同；应复现全期 13,758,182.573724 元 / 交付期 12,233,050.830708 元（决策点 D8）"
  M4:
    definition: "仅 0:00 计划、无调整：q ≡ b（全 144），偏差项恒 0，缺口由结算层 q_em 承担"
    scope_note: "M4 ⊆ M1 的口径论证见命题 P1；比较须用同起点或累计口径"
  M5:
    definition: "加密决策时刻族：{0 + 每 3 小时}、{0 + 每 1 小时}；同一发布集（各时刻用最近一次已发布预报）"
    status_warning: "每 3 小时与 M1 逐位同值；每 1 小时反转 +83.4747 元/14 天（F4）——C5 须先定 tie-breaking（决策点 D3）"
  M6:
    definition: "偏差项 MILP 精确化：二元 z^+/z^- + 紧 Big-M（u^+ <= b*z^+、u^- <= q_max*z^-、z^+ + z^- <= 1）；4 个指定日做日尺度 oracle"
    big_m_note: "q_max_{d,i} = L*delta_t + 833.3333 + Pi_m[i]*delta_t（由模型推导，非『足够大的数』；F8）"
    degradation_note: "全年 MILP 可降级为『4 天 oracle + 全年 LP 损失界』，降级须登记（决策点 D6）"
  M7:
    definition: "强制口径对照族：M7·D2-B（C_plan 改 sum p*min(b,q)）、M7·D2-C（-0.5*p*(b-q)^+ 退款）、M7·D5-B（分段常数降尺度）、M7·PLAN-EXP（计划层 (PL-0b)）"
    requirement: "每条须给出 Delta C / Delta C_plan / Delta C_em / Delta C_adj / Delta sum q_em 全量差额，不得只报方向（C7）"
  M8:
    definition: "M1 的独立第二实现（不同变量消去/书写次序/求解器设置，如消去 E、highs-ds、presolve=False）"

