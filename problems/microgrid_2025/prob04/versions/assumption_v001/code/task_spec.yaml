# prob04 隔离计算 task 规格（链 4-2 ≙ 「波动电价下重算问题 2」；computation 阶段由 resource-manager 提交）
# 生成者：implementation-agent（动作 act-be9040ad7b264d3e）
# 依据：agents/implementation-agent.md、agents/resource-manager.md、PROJECT.md、config/gates.yaml、
#       AGENTS.md「prob04 交付结构」（一道小问、两套结果）与「A8 团队裁定 + 六条派生」、
#       prob04 assumption_v001（AS01–AS23 + D1–D12 推荐项 + R-1/R-2）与 formulation_v001
#       （§1.3 预测器、§1.4 降尺度、§2.2–§2.6 链 4-2、§4.2 A2-PRE、§8.2–§8.7 接口与黑名单）
# 说明：本文件只是**规格**，implementation 阶段不得自行创建 task；task 由 Runner/tasks.py 确定性创建。
#
# 口径要点（不得逐问更改）：
#   * **A8-(b)**：0:00 时当天实时电价（附件 4）未知；决策层用历史实际价构造的预测价 \hat p，
#     结算层一律用附件 4 实际价；**禁止**「全天电价已知」类表述；
#   * 链 4-2 的结构 = **逐日向前递推**（每天 0:00 一个当日 LP，E_{d,0} = E_{d−1,144} 传递、
#     E_{1/1,0} = 6000、终端自由）；**不得**写成单一长时域 LP（那需要全年价格信息）；
#   * 主价格预测器 = PF-PERSIST（\hat p_{d,i} = p^{act}_{d−1,i}）；D_req MAE = 0.084326 元/kWh 为三者最小，
#     故按预注册规则（BT-5）选定；PF-DUAL/PF-HIST 为强制基准、PF-AR 归 ablation；
#   * 计划层目标 min Σ \hat p·b + Σ α_em·\hat p·q_em（**q_em 变量必须保留**，即使预期恒零）；
#   * 结算层闭式：r = b + q_dis + PV^act·Δt − L·Δt − c；s' = max(0,r)；q_em = max(0,−r)（4-2 中恒 0）；
#   * 目标 C_total^{act} = C_plan^{act} + C_em^{act}（4-2 **无** C_adj；元，**不乘 Δt**，单日 10^3 元即硬错误信号）；
#   * c ≤ 833.3333、q_dis ≤ 750.0000、E ∈ [1200,10800]、两侧功率 ≤ 5000 kW、b ≥ 0 无上界；
#   * 弃光界用 D9-B 物理盈余界：0 ≤ s ≤ max(0, PV^act·Δt − L·Δt)；
#   * **附件 1 禁用**；模板 data/附件5/result4-2.xlsx 只读，交付工作簿新写入独立 output_directory。
spec_version: 1
problem_id: microgrid_2025
question_id: prob04
stage: computation
assumption_version: assumption_v001
formulation_version: formulation_v001
backend: local
working_directory: "."
code_path: problems/microgrid_2025/prob04/versions/assumption_v001/code
config_path: problems/microgrid_2025/prob04/versions/assumption_v001/code/task_config.yaml
input_path: data
output_directory: problems/microgrid_2025/prob04/versions/assumption_v001/results/prob04_v001_f001_4-2_run002
timeout_seconds: 1800
seed: null
gpu_required: false
device: cpu
gpu_serial_constraint: "本 task 不使用 GPU（gpu_required=false，链 4-2 为 CPU HiGHS 的确定性 LP），故不占用单卡 GPU 串行额度；若未来引入 GPU 路径必须单卡串行"
worker_launch_mode: supervised
companion_task_spec: problems/microgrid_2025/prob04/versions/assumption_v001/code/task_spec_4-3.yaml
deliverables_note: >-
  prob04 = **一道小问、两套结果**（AGENTS.md 团队纪律）：本任务交付体 = **两道 task / 两个交付件**。
  本文件（task_spec.yaml）对应链 `4-2`，交付 `result4-2.xlsx`（≙ 重算问题 2）；
  配套任务见 `companion_task_spec`（task_spec_4-3.yaml），交付 `result4-3.xlsx`（≙ 重算问题 3）。
  两者**共用**附件 4 电价、同一价格预测器（PF-PERSIST）与同一结算口径，但决策结构不同
  （4-2：逐日计划 + 5× 价紧急购电；4-3：0:00 计划 + 6:00/12:00/18:00 调整 + 0.5×/1.5× 分段结算 + 紧急购电）；
  `output_directory` **必须不同**，**不得**用一条链的结果充当另一条链，**不得**覆盖 `data/附件5/` 下的模板。
command:
  - ".venv/Scripts/python.exe"
  - "problems/microgrid_2025/prob04/versions/assumption_v001/code/run_prob04.py"
  - "--chain"
  - "4-2"
  - "--data2"
  - "data/附件2.xlsx"
  - "--data4"
  - "data/附件4.xlsx"
  - "--template42"
  - "data/附件5/result4-2.xlsx"
  - "--output"
  - "problems/microgrid_2025/prob04/versions/assumption_v001/results/prob04_v001_f001_4-2_run002"
  - "--days"
  - "365"
  - "--time-limit"
  - "60"
  - "--max-wall-seconds"
  - "1500"
submit_hint:
  tool: scripts/compute_dispatcher.py
  subcommand: submit
  notes:
    - "若 .venv/Scripts/python.exe 无法解析，resource-manager 应改用当前 Runner 解释器（sys.executable）或项目 venv 的绝对路径；不得改用缺少 scipy/openpyxl/numpy 的解释器。"
    - "--output 的取值必须与 output_directory 完全一致（tasks.make_task_spec 会强校验）。"
    - "禁止 --days 小于 365；探针模式（--days < 365）只允许在 implementation/静态检查中使用（改写 probe_result4-2.xlsx），不得作为交付结果。"
    - "必须由 Runner 以 worker_launch_mode=supervised（in-process）启动；detached 在本环境会被沙箱回收。"
    - "本问为确定性 LP：seed=null，不读取任何随机源；重跑必须使用新的 output_directory（..._run002 等），不得覆盖既有结果。"
    - "链 4-2 与链 4-3（companion_task_spec）**必须串行**执行（max_local_concurrent_tasks=1）。"
    - "整链墙钟预算 = --max-wall-seconds 1500（task timeout 1800）；单层 LP 时限 = --time-limit 60。"
inputs_readonly:
  - data/附件2.xlsx
  - data/附件4.xlsx
  - data/附件5/result4-2.xlsx
  - data/（作为 input_path 整体参与 input_hash）
  - "（禁止读取 data/附件1.xlsx：其电价被附件 4 取代，H10）"
expected_outputs:
  - result4-2.xlsx
  - solver_status.json
  - solution.json
  - tables.json
  - forecast_backtest.json
  - tiebreak_audit.json
  - run_manifest.json
expected_runtime:
  wall_clock_seconds_max: 300
  memory_mb_max: 1024
  device: cpu
  lp_calls: 365
  lp_solver_invocations_nominal: 1460
  lp_solver_invocations_note: >-
    每层 4 次名义 LP（① 纯主目标基线 ② AS21 字面 ε 加权诊断 ③ 主目标最优面上的字典序提交解
    ④ 退化/多重最优探测），链 4-2 为每天 1 层 × 365 天 = 1,460 次名义调用；
    T7-2 不变性不满足时每次收缩 ε 另加 1 次（有界于 T7_MAX_SHRINKS=8）。
    实测 implementation 探针：34 天链（含全部产物落盘）≈ 3.6 s ⇒ 全年预期 < 60 s，
    task timeout 1800 s / --max-wall-seconds 1500 余量充足。
expected_failure_conditions:
  - exit_code: 2
    meaning: "某一层 LP 未达最优（infeasible/unbounded/time_limit）或整链墙钟预算耗尽；solver_status.json 的 feasible_incumbent=false"
    route: "route_compute_failure -> implementation-agent 复核 formulation 与数据；不得伪报最优"
  - exit_code: 3
    meaning: "附件 2/4 或模板结构与 accepted 假设不一致（表头、行数、日期连续性、相位标签、模板工作表名/列数/列标签、--model/--chain 组合非法）"
    route: "needs_revision -> mathematical_formulation 或 assumption_definition"
  - exit_code: 4
    meaning: "硬检查或模板填报校验失败（层残差、结算平衡/恒等式 > 1e-6、边界越界、E 越界、两侧功率 > 5000 kW、4-2 的 q_em ≠ 0、AS21 主目标不变性 > 1e-9、解析界/量级带越界、表 1 位置口径不符、result4-2.xlsx 填报残留 format_residuals 非空）"
    route: "needs_revision -> implementation 修复或 mathematical_formulation 复核"
  - exit_code: 1
    meaning: "未捕获异常（Python 运行时错误）"
    route: "code_runtime -> implementation-agent 修复代码"
acceptance_hint:
  - "solver_status.json: status=0、feasible_incumbent=true、lp_calls=365、layer_status_max=0、层等式/不等式残差 <= 1e-6（绝对）且相对残差 <= 1e-8；lp_solver_invocations_nominal=1460 为名义值（实际由 AS21 的 ε 收缩次数决定）"
  - "tiebreak_audit.json: policy=AS21、layers=365、checks_failed 为空；summary.all_layers_invariance_passed=true、summary.max_primary_relative_change <= 1e-9；per_layer 含 365 条逐层记录（epsilon/primary_before/primary_after/throughput/degeneracy_degree/boundary_state_kwh/committed_solution）"
  - "退化层数（degenerate_layers）与 layers_with_remaining_multiplicity 必须如实报告（> 0 属结构性事实，不是失败）；不得把不同最优轨迹判为不一致"
  - "solution.json: checks_failed 为空；I1/I2 逐日与交付期切片残差 <= 1e-6；跨日连续性 <= 1e-6；状态转移 <= 1e-6；结算平衡 <= 1e-6；层内余额残差 <= 1e-8；4-2 的 Σq_em ≡ 0（定理，硬检查）"
  - "solution.json.belief: C^fc 与 ΔC_price（= C^act − C^fc）分项齐备，且与 C^act 使用**同一组决策量**（不重解）；ΔC_price 的符号按实测，不得预设为正"
  - "solution.json.delivery（D_req 口径）与 stdout 摘要（D_full 口径）**必须分别给出**；run_manifest 的 total_*_kwh 为 D_req 口径，且 total_purchase_kwh 装 Σq（4-2 中 q ≡ b）"
  - "solution.json.totals: max c <= 833.3333、max q_dis <= 750.0000、max_side_power_kw <= 5000、E ∈ [1200,10800]、E_{1/1,0} = 6000"
  - "量级自检（正式模式硬检查）：交付期 C_total^act ∈ [3e6, 5e7] 元、日均 ∈ [5e3, 2e5] 元；落入 10^5/10^8 元先查口径错位"
  - "forecast_backtest.json: 含 PF-PERSIST/PF-DUAL/PF-HIST/PF-AR 在 D_req（334 天）与 D_full（364 天）的 MAE/MAPE/RMSE/bias/P50/P90/P99/逐日夺冠；selection.selected 必须为 PF-PERSIST（PF-AR 不参与主口径选择）；PF-PERSIST 的 D_req MAE 与 assumptions.md 登记值 0.084326 相对差须 < 5%"
  - "tables.json: 4 个指定日期（2025-03-20/06-21/09-23/12-21，0 基日序 78/171/265/354）；表 1 六时段行位置 60/72/84/96/108/120，购电量用**最终量**（4-2 为 b）、全天购电费为 C_total,d；表 2 每日 6 块（行位置 24(k−1)+1…24k）且 table2_note 显式区分 prob01 单日周期与本题多日滚动切片；表 3 合并区间 + 左端点标签 + 每日至少 1 行"
  - "result4-2.xlsx: 计划购电量 335 行 × 147 列（334 天 × 144 时段 + 全天购电量 + 全天购电费）；充放电量 1 + 334×6 行且 时刻/储电量 只在每日前两行；紧急购电量 每日至少 1 行（J_d=0 写 —/0）；run_manifest.workbook_info.format_residuals 必须为空"
  - "run_manifest.json: code_sha256、附件 2/4 与对应模板 md5、device=cpu、seed=null、gpu_required=false、layer_inputs（含 future_price_used_in_decision=false 与未来价格黑名单说明）、matrix_scale、naming、statistics、checks_failed 齐备，供 sanity/ablation/robustness 追踪"
