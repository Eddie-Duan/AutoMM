- id: AS04
  title: 储能状态转移、效率、容量/功率约束与量纲
  statement: E_t = E_{t-1} + 0.9·c_t − q_dis_t/0.9；1200 ≤ E ≤ 10800 kWh；c ≤ 833.3333
    kWh、q_dis ≤ 750.0000 kWh（口径丙：两侧功率同时 ≤ 5000 kW）；Delta_t = 1/6 h，功率 × Delta_t =
    电量；目标与费用以元计且不乘 Delta_t。
  type: 边界条件（设备）
  key: false
  criticality: high
  evidence_type: inherited
  reference_ids: []
  basis: prob01 accepted AS05/AS06 + 团队裁定 D10 口径丙 + 团队勘误 E1（q_dis = 750.0000）。
  applicability: 两链所有层的储能变量。
  bias_if_invalid: 界写错会改变可行域；乘 Delta_t 会使费用差 6 倍（量级错误）。
  validation: sanity L1/L2 逐时段检查两侧功率 ≤ 5000 kW；L3 抽查状态转移闭合与费用量级（交付期 10^7 元）。
  relations: AS05（s 的界）、AS15/AS17（费用项）的量纲前提。
  status: inherited
