- id: AS07
  title: 价格可观测性与决策时序（A8-(b)，团队裁定）
  statement: 0:00 时当天及任何未来日的附件 4 实时电价均未知。决策层只能用历史价格（d' < d）与其他已有附件（4-2：附件 2 实际；4-3：附件
