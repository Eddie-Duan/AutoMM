- id: AS15
  title: 4-2 目标函数与费用分解（C_plan + C_em）
  statement: 第 d 日计划层目标 min Σ_i p_hat_{d,i}·b_{d,i}（元，不乘 Delta_t），保留 q_em >= 0 与 alpha_em·p_hat·q_em
    项（最优值恒 0，不得删除变量）；结算口径费用分解 C_total_act = C_plan_act + C_em_act（C_plan_act = Σ p_act·b、C_em_act
    = Σ alpha_em·p_act·q_em = 0），4-2 无 C_adj。
  type: 决策偏好（目标）
  key: true
  criticality: high
  evidence_type: literature_fact
  reference_ids:
  - ref-paulauskas-2024-battery-scheduling-arbitrage
  - ref-zhang-2021-arbitrage-technologies
  - ref-staffell-2016-maximising-storage-value
  - ref-hai-2025-microgrid-price-ems
  basis: 题面问题 2 与问题 4 的费用结构 + 承 prob01 D9（不乘 Delta_t）与 prob03 T1（计划层目标必须显式给出）；文献支撑按价格曲线调度、容量/效率/功率约束与问题族定位。
  applicability: 仅 4-2。
  bias_if_invalid: 目标缺失会使 b 在可行域内不唯一、C_plan 不可复现；乘 Delta_t 会错量级。
  validation: sanity L3 复核 C_total = C_plan + C_em 恒等式与 C_plan 逐日可复算；量级自检（交付期 10^7
    元）。
  relations: AS06/AS16；与 4-3 的 AS17 对照。
  status: accepted
- id: AS16
  title: 紧急购电作用位置与分链的 q_em 机制（A23）
  statement: 两链均保留 q_em >= 0，作用位置为等式平衡左端且仅补足负载缺口、不用于储能充电。4-2：物理输入在 0:00 已知、等式平衡含 s
    >= 0 且计划层精确闭合，故 q_em ≡ 0（定理级结论，与价格是否已知无关）；价格不确定性只影响 C_plan（即 Delta_C_price）。4-3：决策层用附件
    3 预报、结算层用附件 2 实际，缺口由光伏预报误差产生，q_em 由结算层互补结构唯一确定；价格误差不改变该机制。
  type: 机理（可靠性）
  key: false
  criticality: high
  evidence_type: inherited
  reference_ids: []
  basis: prob02 AS06 + D4-A、prob03 F2/F3（承接）；4-2 的恒零为本问 agent_inference 证明（r = s >=
    0 ⇒ q_em = max(0, −r) = 0）；恒零属模型内推论，不得包装为文献结论。
  applicability: 两链。
  bias_if_invalid: 4-2 若出现 q_em > 0 应先怀疑信息集越界或平衡式写错；4-3 若把 q_em 放进决策层并允许替代普通购电会破坏作用位置口径。
  validation: sanity L2 复核 4-2 全时段 q_em ≡ 0 与平衡残差；4-3 统计 q_em > 0 时段数、Σq_em 及归因（承
    C9/R12）；两链统计 q_em > 0 与 c > 0 同时成立的时段数。
  relations: AS15/AS17/AS18；决策点 D4。
  status: accepted
- id: AS17
  title: 4-3 双向分段结算（读法 A 主口径 + B/C 强制对照）
  statement: 主口径（承 prob03 B1-D2-A 读法 A）：C_total_act = Σ p_act·b + Σ[beta_def·p_act·(b−q)^+
    + beta_over·p_act·(q−b)^+] + C_em_act，两段均为成本项，基准为当天 0:00 计划、以最终量 q 单次结算、不回溯；决策层的同一表达式用该层
    p_hat（C_fc）。强制对照 M7·D2-B 与 M7·D2-C 必须在 ablation 跑出全量差额。
  type: 决策偏好（结算）
  key: true
  criticality: high
  evidence_type: literature_fact
  reference_ids:
  - ref-bottieau-2020-imbalance-settlement-forecast
  - ref-yang-2020-deviation-penalty-distribution
  - ref-yang-2023-da-rt-shared-storage
  - ref-scharff-2016-elbas-intraday
  basis: prob03 B1-D2-A/T2 + prob04 阶段级强制要求（4-3 必须含 0.5×/1.5× 分段结算）；文献支撑偏差/不平衡结算的制度与建模形式，系数
    0.5/1.5 由题面硬给定、文献不支撑系数。
  applicability: 仅 4-3。
  bias_if_invalid: 把 0.5× 段写成退款（读法 C）会诱导高报计划的非物理激励；两段混记会使 C_adj 不可复算。
  validation: sanity L3 逐项复算 0.5·Σp(b−q)^+ 与 1.5·Σp(q−b)^+；ablation 报告两条对照读法的全量差额（prob04
    数字重跑，不得沿用 prob03 数值）。
  relations: AS14/AS18；决策点 D7。
  status: accepted
- id: AS18
  title: 4-3 三层结构、不回溯与「实际光伏只进结算层」
  statement: 4-3 为顺序向前递推的三层结构：计划层（m=0）→ 调整层（m=6/12/18，i <= 6m 锁定）→ 实际结算层（用附件 2 实际光伏，事后闭式）；不存在等价单次联合
    LP；实际光伏只进结算层，不改变任何决策量与储能轨迹，只改变 q_em/s'/C_em。计划层目标 min Σ p_hat^(0)·b；调整层目标 = 该层剩余时段
    R_m 的预测价偏差结算；调整量取替代量口径（q 为最终购电量，i <= 6m 取先前层提交值）。
  type: 机理（决策时序）
  key: true
  criticality: high
  evidence_type: literature_fact
  reference_ids:
  - ref-scharff-2016-elbas-intraday
  - ref-bottieau-2020-imbalance-settlement-forecast
  - ref-krishnamurthy-2018-arbitrage-da-rt
  - ref-komorowska-2024-liion-price-arbitrage
  basis: prob03 F1/F2/F3 与 B1-D3（承接）+ 团队阶段级要求（4-3 须含 0:00 计划 + 三调整时刻）；文献支撑日内市场修正头寸、偏差结算与日前—实时结构。
  applicability: 仅 4-3。
  bias_if_invalid: 写成联合 LP 或让调整层使用未发布预报/未来实际值会使费用被低估并抹平调整机制的价值；回溯修改破坏因果性。
  validation: implementation 落盘各层输入指纹、层目标值与提交解；sanity L1（不回溯/信息集）与 L2（结算层互补结构）复核。
  relations: AS11/AS17/AS19。
  status: accepted
- id: AS19
  title: 附件 3 预报语义、10 分钟降尺度与年末边界（承 D5-A/D6-A）
  statement: 「预报 k 小时」= 发布时刻 m 之后第 k 个整点的功率点值；10 分钟降尺度 = 整点锚定线性插值（发布后第一小时前向保持），不强制块内能量守恒且须显式披露；发布时刻
    m 只支配 i >= 6m+1（m 为小时，已提交为 i <= 6m）；跨年项（m+k > 24）不消费、不截断、不外推；读取附件 3 时日期列必须前向填充。
