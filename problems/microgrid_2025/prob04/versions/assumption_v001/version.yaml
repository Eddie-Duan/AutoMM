  applicability: 仅 4-3。
  bias_if_invalid: 不前向填充会丢 3/4 的行；改用块内能量守恒与 D5-A 冲突。
  validation: sanity L1 复核「每天恰 4 个发布时刻 × 24 个提前量 = 1460 组」；E3 纪律：不得以预报 RMSE 作跨发布时刻比较轴；prob03
