  statement: 各层 0 ≤ s ≤ max(0, PV^层·Delta_t − L·Delta_t)（PV^层 为该层信息集对应的光伏）；目标系数恒为
    0（无售电收益）；变量保留、最优解允许取 0。
  type: 机理
  key: false
