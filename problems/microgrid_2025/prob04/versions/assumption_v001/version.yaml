- id: AS08
  title: 主价格预测器 PF-PERSIST 与滚动回测协议
  statement: 主预测器 = 前一日同时段：p_hat_{d,i} = p_act_{d-1,i}（i = 1..144）；d = 2025-01-01
    无前一日，不参与回测（D_full 计 364 天）。强制基准：PF-DUAL（水平 × 时段双因子：p_hat = mu_d·s_i，s_i 为归一化历史同时段形状、mu_d
    为最近 7 个可用历史日的日均价均值）与 PF-HIST（历史同时段扩张窗均值）。滚动回测协议（跑数前冻结）：只用 t 日之前信息；主窗口 D_req =
    2025-02-01…12-31（334 天）、D_full 诊断；MAE 为主判据并同时报 MAPE/RMSE/bias 与 P50/P90/P99；选择规则：D_req
    MAE 最小者，MAE 相对差 < 1% 视为并列取更简者。PF-AR（逐时段 AR(1)/惩罚回归）登记为 ablation 强制对照。
  type: 数值近似（预测）
  key: true
  criticality: high
  evidence_type: literature_fact
  reference_ids:
  - ref-lago-2018-spot-price-deep-learning
  - ref-kapoor-2023-nz-price-forecasting
  - ref-ibebuchi-2025-daep-endogenous-predictors
  - ref-myttenaere-2016-mape-regression
  - ref-tschora-2022-da-price-forecasting-ml
  basis: 本动作只读滚动回测（D_req）：PF-PERSIST MAE 0.084326 元/kWh、MAPE 13.780%、RMSE 0.123837、bias
    −0.000595、P50/P90/P99 = 0.0500/0.2294/0.3773；PF-DUAL MAE 0.093183、RMSE 0.120951、P90/P99
    = 0.2052/0.3334；PF-HIST MAE 0.100231、MAPE 16.330%；逐日夺冠 218/67/49。文献：公平基准比较（lago-2018）、统计
    vs ML + 基准对照与 sMAPE/MASE（kapoor-2023）、滚动窗口交叉验证且只用预测时点可得信息（ibebuchi-2025）、MAPE
    有偏须同时报绝对指标（myttenaere-2016）。
  applicability: 两链共用；4-3 调整层在此基础上的滚动更新见 AS11。
  bias_if_invalid: 任何使用 t 日当天信息的实现即越界；形式回测与探针 MAE 相对差 > 5% 应先怀疑实现口径（相位/前向填充/切片）而非改预测器。
  validation: implementation 在隔离 task 复现同一滚动回测并落盘全部分位数；sanity L3 复核输入不含 t 日信息；论文报告三者指标与预测器选择敏感性。
  relations: AS07 的落地；AS09 与 AS11 的前提；AS22（接口）。
  status: accepted
- id: AS09
  title: 决策—结算分离与「价格预报误差的代价」双口径
  statement: 决策层（4-2 计划层；4-3 计划层与调整层）目标与偏差/紧急项使用该层信息集下的预测价 p_hat；结算层全部分项（C_plan、C_em、C_adj
    两分段）一律按附件 4 实际价 p_act 计。对同一组提交决策分别按两套价格计价得 C_act（主）与 C_fc（决策层信念），给出 Delta_C_price
    = C_act − C_fc 并分解为 Delta_C_plan/Delta_C_em/Delta_C_adj，D_req 与 D_full 两窗口同时报告。
  type: 报告口径（成本）
  key: true
  criticality: high
  evidence_type: literature_fact
  reference_ids:
  - ref-khani-2015-online-adaptive-rtod
  - ref-staffell-2016-maximising-storage-value
  - ref-mathaba-2014-price-forecast-benefit
  - ref-hodge-2018-forecast-value-storage
  - ref-antweiler-2021-storage-microeconomics
  basis: AGENTS.md A8-(b) 派生②；文献支撑预测价决策/事后价结算、完美预知对照与以调度成本增量度量预测价值。
  applicability: 两链全部费用。
  bias_if_invalid: 只报一个口径会低估/高估真实支出或无法回答预测误差的经济价值；两套口径若重解模型则不是误差代价而是方案对比。
  validation: sanity L3 复核 C_act 的分项恒等式（4-2 无 C_adj）与 C_fc 逐项可复算；论文与 ablation 同时给出
    Delta_C_price 与预测器选择敏感性。
  relations: AS08 的经济映射；AS15/AS17 的分项定义；AS11 的预测价。
  status: accepted
- id: AS10
  title: 4-2 的逐日计划与跨日向前递推（D8-A 冲突的处理）
  statement: 4-2 每天 0:00 制定一次当天计划、当天不再调整。实现为逐日向前递推：对每个 d 用 p_hat_{d,·}（只用 d−1 及之前的价格）与当天已知的附件
    2 实际负载/光伏解一个单日确定性 LP，提交 (b, c, q_dis, s) 并断言 q ≡ b；状态按 E_{d,0} = E_{d-1,144} 传递，终端自由。4-2
    不得写成单一长时域 LP（那需要全年价格信息，违反 AS07）。
  type: 机理（决策时序）
  key: true
  criticality: high
  evidence_type: literature_fact
  reference_ids:
  - ref-krishnamurthy-2018-arbitrage-da-rt
  - ref-yang-2023-da-rt-shared-storage
  - ref-staffell-2016-maximising-storage-value
  basis: 题面「针对波动电价建立微网当天购电策略的数学模型」+ A8-(b)（未来价格未知）；文献支撑日前—实时两阶段结构与无预知可用信息下的调度对照。与
    prob02 D8-A（单一长时域、价格完全已知）不相容，属 A8-(b) 的强制派生修正（P4-D1）。
  applicability: 仅 4-2。
  bias_if_invalid: 写成单一长时域 LP（预测价）会把跨日价格信息提前给计划层而低估费用；写成完全信息实际价则违反 A8-(b)。
  validation: implementation 落盘逐日求解日志；sanity L1 检查计划层输入指纹不含任何 >= d 日的价格；与 4-3 的退化同构仅作结构检查。
  relations: AS03/AS07/AS15；决策点 D2/D3。
  status: accepted
- id: AS11
  title: 4-3 调整层的滚动价格预测与逐层信息集
  statement: '决策时刻 m ∈ {0,6,12,18}（小时）。计划层（m=0）：p_hat = p_act_{d-1,·}，光伏 = 附件 3 的
    0:00 预报降尺度。调整层（m = 6/12/18）：i <= 6m 用实际价 p_act_{d,i}；i > 6m 用 p_hat_{d,i} = kappa_m·p_act_{d-1,i}，kappa_m
    = A_m/B_m（A_m 为当日 i <= 6m 实际均价、B_m 为前一日同时段均价），防御性截断 kappa_m ∈ [0.5, 2.0]；kappa_0
    ≡ 1；光伏 = 附件 3 的 m 时刻预报降尺度；锁定 i <= 6m，剩余时段 R_m = {i : 6m < i <= 144}。'
  type: 信息结构
  key: true
  criticality: high
  evidence_type: literature_fact
  reference_ids:
  - ref-chitsaz-2018-price-forecast-btm-storage
  - ref-jiang-2015-hour-ahead-bidding-adp
  - ref-khani-2015-online-adaptive-rtod
  basis: AGENTS.md A8-(b) 派生③（调整层用滚动更新的价格预测并逐层写明信息集）；文献支撑小时内滚动更新、信息逐步揭示的序贯决策与在线修正。
  applicability: 仅 4-3。
  bias_if_invalid: 调整层使用 i > 6m 的实际价属越界；kappa_m ≡ 1 会浪费当日已实现价格信息；不截断会在异常日放大误差。
  validation: implementation 落盘每层 kappa_m、价格/光伏来源与锁定时段；sanity L1 逐层对照本表；ablation 给出
    kappa_m ≡ 1 的对照费用。
  relations: AS07/AS08/AS17/AS18；决策点 D6。
  status: accepted
- id: AS12
  title: 主口径 = 价格点预测 + 确定性 LP；不确定性对照仅 ablation
  statement: 两链主结果只出自「价格点预测 + 确定性线性规划」；随机规划、鲁棒优化、概率/区间预测、在线/ADP 策略只能作为 ablation 对照并标注口径差异，不得替换主结果。改主口径须先由团队裁定并新建假设版本。
  type: 数值近似（模型族）
  key: true
  criticality: high
  evidence_type: literature_fact
  reference_ids:
  - ref-akbari-2019-stochastic-robust-arbitrage
  - ref-oconnor-2025-conformal-price-forecast
  - ref-jiang-2015-hour-ahead-bidding-adp
  basis: AGENTS.md A8-(b) 派生④（主口径 = 点预测 + 确定性 LP，鲁棒/场景随机只作 ablation）+ 承 prob03 B0（主结果唯一来源）；文献为对照口径提供先例。
  applicability: 两链。
  bias_if_invalid: 把鲁棒/随机结果写进主表违反 B0；反之若否认不确定性存在则缺少风险量化。
  validation: ablation 给完全信息上界、场景/鲁棒对照、预测器选择敏感性三组；sanity L1 核对主表数值只来自主口径 run。
  relations: AS07/AS08；决策点 D8。
  status: accepted
- id: AS13
  title: 两链共用同一预测器与同一结算口径（A21 = (a)）
  statement: 4-2 与 4-3 共用同一价格预测器（AS08 的 PF-PERSIST，4-3 调整层按 AS11 做水平校正）与同一结算口径（AS09/AS14：结算用附件
    4 实际价、价格基数一致）；两链差异只允许来自 4-3 的调整层、0.5×/1.5× 分段结算与附件 3 预报带来的光伏预报误差，论文对比必须按此三项归因。
  type: 决策偏好（口径统一）
  key: false
  criticality: high
  evidence_type: team_decision
  reference_ids: []
  basis: AGENTS.md A8-(b) 派生⑥ + 本版本 §0.3 的 A21 裁定（两链共用）。
  applicability: 两链。
  bias_if_invalid: 两链用不同预测器会使差额无法归因到制度差异，跨链结论作废。
  validation: sanity L1 核对两链预测器配置与结算价格字段；cross_question_review 核对口径表。
  relations: AS08/AS09/AS14；决策点 D11。
  status: accepted
- id: AS14
  title: 结算倍数与费用项的价格基数（A22）
  statement: alpha_em = 5（两链紧急购电）、beta_def = 0.5 / beta_over = 1.5（仅 4-3 偏差结算）的结算基数一律为附件
    4 实际价 p_act；决策层的预测价口径（C_fc）以相应层 p_hat 为基数；三者不得混记（H12）；附件 1 电价不得出现（H10）。
  type: 边界条件（价格基数）
  key: false
  criticality: high
  evidence_type: team_decision
  reference_ids: []
  basis: 本问 A22 登记 + 承 prob03 B1-D2-A/D7-A 的价格基数口径。
  applicability: 两链全部价格引用点（含 4-3 调整层的 beta_def·p_hat）。
  bias_if_invalid: 漏替换某一价格引用点会产生「部分用旧价」的静默污染，内部恒等式仍可能通过。
  validation: implementation 给出价格引用点清单并逐项标注附件 4 来源；sanity L3 抽查 4 个指定日期 × 全部价格项。
