decision_reason: prob04 formulation_v001 已同时闭合两条链的两个模型并给出公式级落地：4-2 为逐日向前递推确定性 LP +
  事后闭式结算（单日 864 变量/288 等式，全年 365 或 334 次 LP；计划层只用 p^act_{d−1,·} 与附件 2 实际，结算层用附件 4
  实际价），其 q_em ≡ 0 有两步定理级证明（替换论证 ⇒ 计划层恒零；等式平衡精确闭合 ⇒ r = s ≥ 0 ⇒ 结算层恒零，与价格是否已知无关，非移植
  prob02 A17）；4-3 为计划层 0:00 + 调整层 6:00/12:00/18:00 + 实际结算层的三层顺序向前递推（单日合计 2,232 变量/720
  等式，全年 1,460 或 1,336 次 LP；调整层 i ≤ 6m 用当日已实现实际价、i > 6m 用 κ_m·p^act_{d−1,i}，实际光伏只进结算层）。两链各自给出价格可观测性口径与逐层信息集台账，共用同一
  PF-PERSIST 预测器与同一结算口径；费用同时给出 C^act 与实际价/预测价两套口径之差 ΔC_price（分项 + D_req/D_full 两窗口，同一组决策量不重解）。A8-(b)
  六条派生口径逐条落地，assumptions.md 的阻塞清单 9 项全部闭合（预测器公式与回测协议、两套计价逐项、s 的界分层写法、q_em 作用位置与恒零证明、C_adj
  两分段与 ablation 对照接口、逐层信息集与不回溯公式化、跨年 36 项与降尺度披露、p^act/hat p/κ_m 局部符号登记、规模与 compute.yaml
  对照）。给出 7 个候选方案（覆盖精确/启发式/混合）与看到结果前冻结的比较标准，推荐 M4-2/M4-3 为主路径；§8.8 给出团队预注册 ablation
  对照项（S-VAR 两阶段随机、S-RH 滚动时域前瞻深度 H ∈ {1,3,7,14}、S-VAR-RH 组合项，以及 A2-PRE/M3-ter/M4-ter/PF-ALT/κ1/D2-B/D2-C/M6/M8/R-CAP/R-KAPPA/R-TIE）的
  formulation 级接口与判据，并标注 S-RH 的超 24 h 光伏预期须先经 assumptions.md 团队勘误登记；文末 D1–D8 给出 2–3
  备选与推荐，按推荐项继续推进、不等待人工确认。只读小型探针 ALL_PASS=true（量纲与设备界、4-2 的 q_em 恒零、P2 退化同构下 b/q 逐位相同且
  C_total 差 0.0、L6 的 C^pre ≤ C^act、L5 的 LP 与 MILP 差 0.0、三个预测器的未来数据置乱不变性、D_req 量级自检
  UB ≥ LB 且期望 1.359×10^7 元）。全部产物位于 problems/microgrid_2025/prob04/versions/assumption_v001/formulations/formulation_v001/，未修改任何
  accepted 假设版本、上游产物、受保护 manifest 字段与 runtime/workflow_state.json；无人工阻塞条件，建议进入 implementation。
