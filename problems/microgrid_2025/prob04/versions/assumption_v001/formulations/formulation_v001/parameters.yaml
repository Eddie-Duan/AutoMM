# 生成者：mathematical-formulator（动作 act-b41891a79e214751）
# 规则：
#   1. 只登记参数与口径，**不重定义** global_symbols.yaml 中的符号；本问派生记号
#      p^{act} / \hat p^{(m)} / \kappa_m / \hat p^{fc} 为局部声明（AS22）。
#   2. 价格来源唯一 = data/附件4.xlsx（md5 cf8762375436b281dc33b6432e441a6a）；
#      附件 1 电价在 prob04 中作废（H10）。
#   3. q_dis 上界 = 750.0000、c 上界 = 833.3333（团队裁定 D10 口径丙 + 勘误 E1），
#      经探针 A 复算 min(5000*Δt, 5000*Δt/0.9)=833.3333、min(5000*Δt, 5000*Δt*0.9)=750.0。
#   4. 目标与费用**不乘 Δt**（决策变量已是 kWh）；乘 Δt 会使费用偏 6 倍（量纲红线）。
#   5. 跨日口径 = 自 2025-01-01 以 E_init=6000 滚动递推 + 1 月预热 + 终端自由（AS03）。
#   6. 主口径 = 价格点预测 + 确定性 LP（AS12 / A8-(b) 派生 ④）；随机/鲁棒只进 ablation。
#   7. 两链（4-2 / 4-3）**共用**同一价格预测器与同一结算口径；差异仅在 4-3 多出
#      6:00/12:00/18:00 调整层与 0.5x/1.5x 分段结算（AS13 / A8-(b) 派生 ⑥）。
