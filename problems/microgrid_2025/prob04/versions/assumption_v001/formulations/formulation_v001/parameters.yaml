price_predictors:
  frozen_selection_rule: "D_req 的 MAE 最小者为主口径；MAE 相对差 < 1% 视为并列、取更简者（BT-5，跑数前冻结）"
  primary: PF-PERSIST
  mandatory_benchmarks: [PF-DUAL, PF-HIST]
  ablation_only: [PF-AR]
  backtest:
    train_rule: "只用 t 日之前的信息（H_d = {d' : d' < d}）"
    main_window: D_req
    diagnostic_window: D_full
    metrics_primary: MAE
    metrics_secondary: [MAPE, RMSE, bias, P50, P90, P99, daily_win_count]
    null_day_rule: "d = 2025-01-01（H_d = 空）按 (FB) 回退并落盘标记；该日属预热期，不影响交付期指标"
  predictors:
    - id: PF-PERSIST
      formula: "hat_p_{d,i} = p^{act}_{d-1,i}，i = 1..144"
      role: primary
      params: {}
    - id: PF-HIST
      formula: "hat_p_{d,i} = mean_{d' in H_d} p^{act}_{d',i}"
      role: benchmark
      params: {window: expanding}
    - id: PF-DUAL
      formula: "hat_p_{d,i} = mu_d * s_i；s_i = bar_p_i / mean_i(bar_p)；mu_d = mean_{d' in last 7 days of H_d}(mean_i p^{act}_{d',i})"
      role: benchmark
      params: {shape_normalization: "mean_i(s_i) = 1", level_window_days: 7}
    - id: PF-AR
      formula: "hat_p_{d,i} = a_i + phi_i * p^{act}_{d-1,i}（系数只用 H_d 估计）"
      role: ablation_only
      params: {per_slot: true}
  diagnostics_from_assumption_probe:
    note: "以下为假设阶段（act-fca33f7acdfd48dc）只读探针的 D_req 诊断值，**不得**作为论文/sanity 交付数值；正式回测由 computation 阶段隔离 task 复算"
    PF-PERSIST: {MAE: 0.084326, MAPE: 0.13780, RMSE: 0.123837, bias: -0.000595, P50: 0.0500, P90: 0.2294, P99: 0.3773, daily_wins: 218}
    PF-DUAL: {MAE: 0.093183, MAPE: 0.15181, RMSE: 0.120951, bias: -0.000328, P90: 0.2052, P99: 0.3334, daily_wins: 49}
    PF-HIST: {MAE: 0.100231, MAPE: 0.16330, RMSE: 0.136878, bias: 0.013161, P90: 0.2411, P99: 0.3963, daily_wins: 67}

models:
  "4-2":
    name: M4-2
    class: "确定性逐日向前递推 LP + 事后线性闭式结算"
    layers: [plan_daily, settlement]
    decision_hours: [0]
    lp_calls_full: 365
    lp_calls_delivery: 334
    single_day_lp_vars: 864
    single_day_lp_eq: 288
    price_input: '\hat p_{d,i} = p^{act}_{d-1,i}（仅 <= d-1 日）'
    pv_input_decision: "PV^act（附件 2 实际；问题 2 无预报机制）"
    pv_input_settlement: "PV^act"
    settlement_price: "p^{act}"
    cost_items: [C_plan, C_em]
    q_em_property: "q_em == 0（定理，见 formulation §2.3；计划层等式平衡 + s >= 0 自由处置）"
    tie_break: 'AS21 字典序：先 min Σ \hat p·b（+ alpha_em 项），再 min Σ(c + q_dis)'
    objective: 'min Σ_{i=1..144} \hat p_{d,i} b_{d,i} + Σ_i alpha_em \hat p_{d,i} q_em_{d,i}'
    s_upper_bound: "max(0, PV^act*dt - L*dt)（AS05 / D9-B）"
    q_variable: "不定义独立 q；结算层 q := b"
  "4-3":
    name: M4-3
    class: "确定性三层顺序向前递推 LP（4 个决策时刻）+ 事后线性闭式结算"
    layers: [plan_0, adjust_6, adjust_12, adjust_18, settlement]
    decision_hours: [0, 6, 12, 18]
    lp_calls_full: 1460
    lp_calls_delivery: 1336
    single_day_lp_vars: 2232
    single_day_lp_eq: 720
    price_input:
      plan: '\hat p^{(0)}_{d,i} = p^{act}_{d-1,i}'
      adjust: "i <= 6m 用 p^{act}_{d,i}；i > 6m 用 kappa_m * p^{act}_{d-1,i}"
    pv_input:
      plan: "Pi_0[PV]（附件 3 的 0:00 发布预报降尺度）"
      adjust: "Pi_m[PV]（附件 3 的 m 时刻发布预报降尺度，定义在 i >= 6m+1）"
      settlement: "PV^act（唯一入口）"
    settlement_price: "p^{act}"
    cost_items: [C_plan, C_adj, C_em]
    objective_plan: 'min Σ_{i=1..144} \hat p^{(0)}_{d,i} b_{d,i}'
    objective_adjust: 'min Σ_{i in R_m} [beta_def \hat p^{(m)}_{d,i} u^+_{d,i} + beta_over \hat p^{(m)}_{d,i} u^-_{d,i}]'
    s_upper_bound: "max(0, Pi_m[PV]*dt - L*dt)（分层 PV）"
    locked_rule: "i <= 6m 不可回溯；b 是已提交参数，调整层不得改变"
    tie_break: "AS21 字典序，逐层适用"

cost_definitions:
  settlement_basis: "p^{act}（附件 4 实际价）—— 所有费用分项的结算基数（A22/H12）"
  decision_basis: '\hat p^{(m)}（该层信息集下的预测价）—— 决策层目标与 C^{fc} 口径'
  C_plan_act: "Σ_{W,i} p^{act}_{d,i} * b_{d,i}"
  C_adj_act: "Σ_{W,i} [beta_def * p^{act}_{d,i} * (b-q)^+ + beta_over * p^{act}_{d,i} * (q-b)^+]（仅 4-3）"
  C_em_act: "Σ_{W,i} alpha_em * p^{act}_{d,i} * q_em_{d,i}"
  C_total_act:
    "4-2": "C_plan + C_em"
    "4-3": "C_plan + C_adj + C_em"
  C_fc: '把上述各项的 p^{act} 换成 \hat p^{fc}_{d,i} = \hat p^{(nu(i))}_{d,i}（4-2 中即 \hat p_{d,i}）'
  delta_C_price: "C_total^{act} - C_total^{fc}，分项 delta_C_plan / delta_C_em / delta_C_adj，两窗口分别报告"
  windows: [D_req, D_full]
  same_decisions_rule: "两套口径必须使用同一组决策量（只换价格、不重解）；否则改名为方案对比并登记"

comparison_criteria_preregistered:
  hard_constraints: "I2-*/I3-* 恒等式残差 <= 1e-6 kWh；各层余额残差 <= 1e-8；设备界与两侧功率 <= 5000 kW；跨日状态闭合 <= 1e-6；4-3 的 i <= 6m 不回溯"
  metrics: "两链分别报 C_plan/C_em/C_total（4-3 另加 C_adj、Σq）；Σb/Σq/Σq_em/Σs'/Σc/Σq_dis；表 1/2/3"
  scale_consistency: "D_req 与 D_full 分别给出全部指标；run_manifest 的 total_*_kwh 为 D_req 口径且 total_purchase_kwh 装 Σq；stdout 摘要为 D_full 口径（E6）"
  magnitude: "交付期 C_total 属 1e7 元量级；单日 1e4 元；单日 1e3 元判 Δt 硬错误；4-2 的 Σq_em == 0；4-3 的 Σq^em 不应恒零"
  decision_settlement_split: "两链都给出 C^{act}、C^{fc}、ΔC_price 及分项与两窗口；恒等式 C_total^{act} = Σ分项^{act} 残差 <= 1e-6"
  information_set: "4-2 计划层输入指纹不含 >= d 的价格；4-3 逐层落盘预报/价格/锁定时段/初始状态来源；未来数据置乱不变性探针通过"
  optimality: "逐层 solver status / 迭代数 / 目标值；M6 记录 incumbent / mip_gap / 节点数；启发式只能称当前最好可行解"
  model_family: "C1 基线闸门；C2 自洽；C3 M8≡M1；C4 信息单调（P1）；C5 加密单调（先定 tie-break）；C6 LP 无损（L5）；C7 口径对照全量落盘；C8 交付逐格一致；C9 可解释性"

analytic_relations:
  state_transition: "E_{d,i} = E_{d,i-1} + 0.9*c_{d,i} - q_dis_{d,i}/0.9"
  cross_day: "E_{d,0} = E_{d-1,144}；E_{1/1,0} = 6000；E_{12/31,144} 自由（终端自由）"
  identity_4_2:
    - "Σ_i q_dis = 0.81*Σ_i c - 0.9*(E_{d,144} - E_{d,0})"
    - "Σ_i b = N_d + Σ_i s' + 0.19*Σ_i c + 0.9*(E_{d,144} - E_{d,0}) - Σ_i q_em"
    - "C_total,d = C_plan,d + C_em,d"
  identity_4_3:
    - "Σ_i q_dis = 0.81*Σ_i c - 0.9*(E_{d,144} - E_{d,0})"
    - "Σ_i q = N_d + Σ_i s' + 0.19*Σ_i c + 0.9*(E_{d,144} - E_{d,0}) - Σ_i q^em"
    - "C_total,d = C_plan,d + C_adj,d + C_em,d"
    - "C_adj,d = 0.5*Σ p^{act}(b-q)^+ + 1.5*Σ p^{act}(q-b)^+"
  anchors:
    A2_PRE: "价格完全预知 + 附件 2 实际的 4-2 退化模型；由 L6 得 C^{act}(4-2) >= C^{pre}（**成本下界**，见 E-F1）"
    bridge: "Pi_m[PV] ≡ PV^act 且 kappa_m ≡ 1 时 4-3 与 4-2 退化同构（P2）；比较 b/q/q_em/C_total，轨迹比较须先统一 tie-break"

