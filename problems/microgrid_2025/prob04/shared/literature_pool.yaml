  - Mazda Rustomji
  year: 2016
  source: Journal of Energy Storage
  doi: 10.1016/j.est.2016.08.010
  url: https://doi.org/10.1016/j.est.2016.08.010
  authority: A
  verification_level: abstract_oa
  summary: 给出兼顾套利与备用的储能收益最大化算法，并分别在『完美预知价格（perfect foresight）』与『无预知（no foresight）』两种信息下计算利润；摘要报告无预知情形可获得最优利润的
    75–95%，并指出英国电池系统参与备用市场可使利润增至三倍。
  applicable_conditions: 需要量化『价格信息完整度』对储能收益的影响；价格序列可用于事后最优基准。
  supports: F1 + F2c：为『完美预知 vs 无预知』给出可核验的对照范式与量级方向（无预知仍可获大部分最优收益），是 A8-(a) 被否后『决策用预测价、结算用实际价』的误差代价评估锚点。
  differences: 英国的套利+备用市场、单一电池/风电场案例；本问为单一微网、无备用市场、无售电，且 75–95% 是该文案例数值，不得引用为本问结论或标定。
  claim_types:
