  authority: A
  verification_level: abstract_oa
  summary: 把储能持有者的套利收益最大化写成考虑日前电价与实时电价双重不确定性的随机规划，用于市场投标与运行决策及储能经济性估计；在真实市场价格数据上，随机投标方法显著优于确定性基准。
  applicable_conditions: 价格逐时段波动且存在日前/实时两个价格阶段；决策者需在价格不确定下做充放电与投标。
  supports: F1 + F5：支撑 prob04 两条链『价格是逐时段波动的不确定输入，储能充放电决策以其为驱动』这一建模对象；也支撑 4-2 链的日前—实时价差视角。不支撑任何具体预测误差分布或系数取值。
  differences: 该文是储能持有者的随机投标问题（含金融市场头寸）；本问是单一微网价格接受者的确定性 LP 主口径（A8-(b) 点预测），不确定性处理只在
    ablation 作对照。其数值不可引用。
  claim_types:
  - literature_fact
  - agent_inference
  status: used
  decision_reason: 支撑 F1/F5：为『实时波动电价下储能套利/购电决策』提供 A 级、与 A8-(b)（价格不确定、需预测）最贴近的机制与建模先例；仅用其机制级结论，不用其数值。
