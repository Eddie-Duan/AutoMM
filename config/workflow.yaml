mode: full_auto
wake_interval_minutes: 10
one_action_per_wake: true
single_active_problem: true
question_id_format: "prob{index:02d}"
question_count_min: 1
question_count_max: null
allow_parallel_questions: false
allow_parallel_experiments_within_question: true
question_completion_email_is_notification_only: true
final_summary_requires_human_approval: false
max_assumption_versions: 5
rejected_versions_before_research_refresh: 3
pending_wakeup_coalescing: true
running_action_policy: wait
research_agent_mode: synchronous
compute_agent_mode: asynchronous_submit
stages:
  - problem_understanding
  - literature_review
  - assumption_definition
  - mathematical_formulation
  - implementation
  - computation
  - sanity_check
  - visualization
  - robustness
  - ablation
  - locally_completed
  - cross_question_review
  - completed
# 条件阶段（robustness / ablation）的性质判定。
# optional_stages 中的阶段允许 Agent 记录 skipped + 理由后跳过（Harness 放行）。
# mandatory_stages 中的阶段必须 completed：Harness 会拒绝 skipped，并且
#   (1) record_optional_stage 命令抛错；(2) next_action 不会因 skipped 而推进阶段；
#   (3) 本地完成门禁报错。团队裁定：本题 robustness 与 ablation 均为必做。
optional_stages: []
mandatory_stages:
  - robustness
  - ablation
flags:
  pause: runtime/flags/pause.flag
  stop: runtime/flags/stop.flag
  resume: runtime/flags/resume.flag
  pending_wakeup: runtime/flags/pending_wakeup.flag
lock:
  path: runtime/locks/orchestrator.lock
  stale_after_minutes: 60


#1. problem_understanding	problem-decomposer	拆解小问、符号表、依赖图
#2. literature_review	literature-researcher	文献检索、建文献池
#3. assumption_definition	assumption-manager	定义建模假设（版本化）
#4. mathematical_formulation	mathematical-formulator	建立数学模型（版本化）
#5. implementation	implementation-agent	写求解代码
#6. computation	resource-manager	提交隔离计算任务
#7. sanity_check	sanity-checker	L1-L6 合理性检查
#8. visualization	visualization-agent	生成图表
#9. robustness（必做）	robustness-analyst	敏感性/鲁棒性分析
#10. ablation（必做）	ablation-analyst	消融实验
#11. locally_completed	—	小问完成
#12. cross_question_review	cross-question-reviewer	全题跨小问一致性审查
#13. completed → 汇总/论文	build_final_summary / build_paper	研究汇总 + 论文