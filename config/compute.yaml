default_backend: local
# 本地 worker 启动方式：supervised（Runner 原地运行，生命周期与 Runner 一致）
# 或 detached（subprocess.Popen 派生独立进程）。
# 在受限沙箱/短命 shell 调用中（如 DSH 工具调用结束时的进程树回收），detached 子进程会在
# 父调用结束时被回收，worker 在启动数秒内消失并产生 failure_type=interrupted
# （已由 act-6a8ebb7c3b474c7d 的两个独立探针复现）；因此默认 supervised。
# detached 仅当 Runner 在沙箱外的常驻终端/daemon 中运行时才可靠。
worker_launch_mode: supervised
max_local_concurrent_tasks: 4
max_remote_concurrent_tasks: 2
duplicate_task_policy: block
local_worker_formula: "min(configured_max, max(1, cpu_count - 1), memory_slots)"
memory_per_worker_gb: 2
force_concurrency_override: false
task_timeout_seconds: 0
worker_startup_timeout_seconds: 60
worker_heartbeat_interval_seconds: 30
worker_lost_grace_seconds: 120
code_repair_attempts: 1
timeout_retry_attempts: 2
retry:
  infrastructure_transient: 3
  code_runtime: 2
  model_revision: 2
  total_productive_rounds: 10
task_id_fields:
  - problem_id
  - question_id
  - stage
  - code_hash
  - config_hash
  - input_hash
  - assumption_version
  - formulation_version
  - backend
remote_poll_interval_seconds: 60
remote_heartbeat_timeout_seconds: 300
retry_lost_remote_tasks: true
max_retries: 2
quality:
  allow_feasible_not_optimal: true
  allow_missing_mip_gap_with_incumbent: true
  require_constraint_residuals: true
github_relay:
  enabled: false
  repository: ""
  branch: main
  push_paths:
    - request/
    - data/
    - problems/
    - config/
    - scripts/
  pull_paths:
    - problems/
    - runtime/
    - reports/
cleanup:
  trash_retention_days: 7
  allowed_kinds:
    - cache
    - temporary_conversion
    - reproducible_intermediate
